<!-- frontend/public/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Ghost Protocol - Anonymous, temporary, real-time conversations. Chat without identity pressure." />
    
    <title>Ghost Protocol - Anonymous Chat</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/ghost-icon.svg" />
    
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Ghost Protocol" />
    <meta property="og:description" content="Anonymous temporary conversations. No identity, no pressure." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://ghostprotocol.com" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ghost Protocol" />
    <meta name="twitter:description" content="Anonymous temporary conversations" />
    <meta name="twitter:image" content="/twitter-image.png" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
